<svg xmlns="http://www.w3.org/2000/svg" width="467" height="134" viewBox="0 0 467 134" role="img" aria-labelledby="title desc">
  <title id="title">Weekly development breakdown</title>
  <desc id="desc">WakaTime language usage for the past week</desc>
  <style>
    text { font: 8px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #417e87; }
    .title { font-size: 12px; font-weight: 600; fill: #006aff; }
    .label { font-weight: 600; }
    .muted, .percent { fill: #417e87; }
    .track { fill: #e7edf0; }
  </style>
  <rect width="466" height="133" x="0.5" y="0.5" rx="4.5" fill="transparent" />
  <text class="title" x="24" y="23">Weekly development breakdown</text>
  <g>
    <text class="label" x="24" y="46">Lua</text>
    <text class="muted" x="118" y="46">6h25m</text>
    <rect class="track" x="184" y="37" width="200" height="7" rx="3.5" />
    <rect x="184" y="37" width="83.6" height="7" rx="3.5" fill="#41b883" />
    <text class="percent" x="443" y="46" text-anchor="end">41.8%</text>
  </g>
  <g>
    <text class="label" x="24" y="65">Markdown</text>
    <text class="muted" x="118" y="65">3h6m</text>
    <rect class="track" x="184" y="56" width="200" height="7" rx="3.5" />
    <rect x="184" y="56" width="40.4" height="7" rx="3.5" fill="#00add8" />
    <text class="percent" x="443" y="65" text-anchor="end">20.2%</text>
  </g>
  <g>
    <text class="label" x="24" y="84">Nix</text>
    <text class="muted" x="118" y="84">1h38m</text>
    <rect class="track" x="184" y="75" width="200" height="7" rx="3.5" />
    <rect x="184" y="75" width="21.4" height="7" rx="3.5" fill="#2c2d72" />
    <text class="percent" x="443" y="84" text-anchor="end">10.7%</text>
  </g>
  <g>
    <text class="label" x="24" y="103">Bash</text>
    <text class="muted" x="118" y="103">55m48s</text>
    <rect class="track" x="184" y="94" width="200" height="7" rx="3.5" />
    <rect x="184" y="94" width="12.2" height="7" rx="3.5" fill="#3178c6" />
    <text class="percent" x="443" y="103" text-anchor="end">6.1%</text>
  </g>
  <g>
    <text class="label" x="24" y="122">Other</text>
    <text class="muted" x="118" y="122">3h15m</text>
    <rect class="track" x="184" y="113" width="200" height="7" rx="3.5" />
    <rect x="184" y="113" width="42.4" height="7" rx="3.5" fill="#8b949e" />
    <text class="percent" x="443" y="122" text-anchor="end">21.2%</text>
  </g>
</svg>
