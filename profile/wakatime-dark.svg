    <rect class="track" x="184" y="37" width="200" height="7" rx="3.5" />
    <rect x="184" y="37" width="66.6" height="7" rx="3.5" fill="#41b883" />
    <text class="percent" x="443" y="46" text-anchor="end">33.3%</text>
  </g>
  <g>
    <text class="label" x="24" y="65">Lua</text>
