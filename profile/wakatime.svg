    <rect x="184" y="37" width="68.8" height="7" rx="3.5" fill="#41b883" />
    <text class="percent" x="443" y="46" text-anchor="end">34.4%</text>
  </g>
  <g>
    <text class="label" x="24" y="65">Lua</text>
