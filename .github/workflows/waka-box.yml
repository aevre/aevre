name: Update wakatime stats

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "5 0 * * *"

jobs:
  build:
    name: Update-waka-stats
    runs-on: ubuntu-latest
    # env:
      # WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      # GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # UPDATE_OPTION: GIST_AND_MARKDOWN
      # MARKDOWN_FILE: README.md
      # GIST_ID: ddee6660ea4819d749c4393b4cc8e382
      # GIST_BARSTYLE: SOLIDLT
      # GIST_BARLENGTH: -1
      # GIST_TIMESTYLE: SHORT

    steps:
      - name: WakaTime Box
        uses: abordage/wakatime-box@v3.0.1
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          WAKA_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

