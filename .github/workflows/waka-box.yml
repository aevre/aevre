name: Update wakatime stats

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "5 0 * * *"

jobs:
  build:
    name: Update-waka-stats
    runs-on: ubuntu-latest
    # env:
    # WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    # GH_TOKEN: ${{ secrets.GH_TOKEN }}
    # UPDATE_OPTION: GIST_AND_MARKDOWN
    # MARKDOWN_FILE: README.md
    # GIST_ID: ddee6660ea4819d749c4393b4cc8e382
    # GIST_BARSTYLE: SOLIDLT
    # GIST_BARLENGTH: -1
    # GIST_TIMESTYLE: SHORT

    steps:
      - name: WakaTime Box
        uses: abordage/wakatime-box@v3.0.1
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          WAKA_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README from Gist
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python3 scripts/update_waka_readme.py

      - name: Commit and push README
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md profile/wakatime.svg profile/wakatime-dark.svg
          git diff --cached --quiet || git commit -m "docs: update WakaTime stats"
          git push
