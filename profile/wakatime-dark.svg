    <rect x="184" y="56" width="64.6" height="7" rx="3.5" fill="#00add8" />
    <text class="percent" x="443" y="65" text-anchor="end">32.3%</text>
  </g>
  <g>
    <text class="label" x="24" y="84">Nix</text>
